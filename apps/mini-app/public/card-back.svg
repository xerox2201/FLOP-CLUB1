<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" fill="none">
  <defs>
    <linearGradient id="backNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1f3a"/>
      <stop offset="50%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="backGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c45a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8861b"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.8" fill="#d4af37" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="250" height="350" rx="18" fill="url(#backNavy)"/>
  <rect width="250" height="350" rx="18" fill="url(#dots)"/>

  <!-- Inner border -->
  <rect x="8" y="8" width="234" height="334" rx="12"
        stroke="url(#backGold)" stroke-width="1.5" fill="none" opacity="0.7"/>
  <rect x="16" y="16" width="218" height="318" rx="8"
        stroke="#d4af37" stroke-width="0.5" fill="none" opacity="0.35"/>

  <!-- Center spade -->
  <g transform="translate(125,175) scale(0.85)">
    <path d="M0 -50 L-35 5 Q-45 20 -38 32 Q-32 42 -18 38 Q-10 35 -5 30 L0 25 Z"
          fill="url(#backGold)"/>
    <path d="M0 -50 L35 5 Q45 20 38 32 Q32 42 18 38 Q10 35 5 30 L0 25 Z"
          fill="url(#backGold)"/>
    <path d="M-8 25 L-10 40 Q-11 48 0 48 Q11 48 10 40 L8 25 Q4 28 0 28 Q-4 28 -8 25 Z"
          fill="url(#backGold)"/>
  </g>

  <!-- Corner ornaments -->
  <g opacity="0.5">
    <circle cx="35" cy="35" r="3" fill="#d4af37"/>
    <circle cx="215" cy="35" r="3" fill="#d4af37"/>
    <circle cx="35" cy="315" r="3" fill="#d4af37"/>
    <circle cx="215" cy="315" r="3" fill="#d4af37"/>
  </g>
</svg>